openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: JustIdeas - Platforma de Înregistrare Firme din România
servers:
  - url: /api
    description: Calea de bază a API-ului
tags:
  - name: health
    description: Stare server
  - name: auth
    description: Autentificare și înregistrare utilizatori
  - name: dosare
    description: Dosare de înregistrare firme
  - name: asociati
    description: Asociați și acționari
  - name: coduri-caen
    description: Coduri CAEN (clasificare activități)
  - name: plati
    description: Plăți și facturare

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Verificare stare
      responses:
        "200":
          description: Server funcțional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Autentificare ──────────────────────────────────────────────────────────
  /auth/inregistrare:
    post:
      operationId: inregistrareUtilizator
      tags: [auth]
      summary: Înregistrare utilizator nou
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InregistrareBody"
      responses:
        "201":
          description: Utilizator înregistrat cu succes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRaspuns"
        "400":
          description: Date invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "409":
          description: Email deja înregistrat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /auth/autentificare:
    post:
      operationId: autentificareUtilizator
      tags: [auth]
      summary: Autentificare utilizator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutentificareBody"
      responses:
        "200":
          description: Autentificare reușită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRaspuns"
        "401":
          description: Credențiale invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /auth/profil:
    get:
      operationId: getProfil
      tags: [auth]
      summary: Obține profilul utilizatorului autentificat
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil utilizator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utilizator"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
    patch:
      operationId: updateProfil
      tags: [auth]
      summary: Actualizează profilul utilizatorului
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfilBody"
      responses:
        "200":
          description: Profil actualizat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utilizator"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  # ── Dosare ─────────────────────────────────────────────────────────────────
  /dosare:
    get:
      operationId: listDosare
      tags: [dosare]
      summary: Listează dosarele utilizatorului curent
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ciorna, in_asteptare, in_procesare, aprobat, respins]
        - name: cautare
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista dosarelor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dosar"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    post:
      operationId: createDosar
      tags: [dosare]
      summary: Creează un dosar nou
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDosarBody"
      responses:
        "201":
          description: Dosar creat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dosar"
        "400":
          description: Date invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /dosare/statistici:
    get:
      operationId: getDosareStatistici
      tags: [dosare]
      summary: Statistici dosare (pentru dashboard)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistici dosare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosarStatistici"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /dosare/{id}:
    get:
      operationId: getDosar
      tags: [dosare]
      summary: Obține detaliile unui dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Dosar găsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosarDetaliat"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    patch:
      operationId: updateDosar
      tags: [dosare]
      summary: Actualizează un dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDosarBody"
      responses:
        "200":
          description: Dosar actualizat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dosar"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    delete:
      operationId: deleteDosar
      tags: [dosare]
      summary: Șterge un dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Dosar șters
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /dosare/{id}/pas:
    patch:
      operationId: updatePasDosar
      tags: [dosare]
      summary: Avansează pasul curent al dosarului (wizard)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasBody"
      responses:
        "200":
          description: Pas actualizat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dosar"
        "400":
          description: Pas invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /dosare/{id}/trimite:
    post:
      operationId: trimiteDosar
      tags: [dosare]
      summary: Trimite dosarul pentru procesare
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Dosar trimis cu succes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dosar"
        "400":
          description: Dosarul nu poate fi trimis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  # ── Asociați ───────────────────────────────────────────────────────────────
  /dosare/{id}/asociati:
    get:
      operationId: listAsociatiDosar
      tags: [asociati]
      summary: Listează asociații unui dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Lista asociaților
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asociat"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    post:
      operationId: addAsociatDosar
      tags: [asociati]
      summary: Adaugă un asociat la dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAsociatBody"
      responses:
        "201":
          description: Asociat adăugat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asociat"
        "400":
          description: Date invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "404":
          description: Dosar negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /dosare/{id}/asociati/{asociatId}:
    patch:
      operationId: updateAsociatDosar
      tags: [asociati]
      summary: Actualizează un asociat
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: asociatId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAsociatBody"
      responses:
        "200":
          description: Asociat actualizat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asociat"
        "404":
          description: Negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    delete:
      operationId: removeAsociatDosar
      tags: [asociati]
      summary: Elimină un asociat din dosar
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: asociatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Asociat eliminat
        "404":
          description: Negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  # ── Coduri CAEN ────────────────────────────────────────────────────────────
  /coduri-caen:
    get:
      operationId: listCodurICaen
      tags: [coduri-caen]
      summary: Listează și caută coduri CAEN
      parameters:
        - name: cautare
          in: query
          required: false
          schema:
            type: string
          description: Caută după cod sau denumire
        - name: sectiune
          in: query
          required: false
          schema:
            type: string
          description: Filtrare după secțiune CAEN
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
        - name: perPagina
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista codurilor CAEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodCaenPaginat"

  /coduri-caen/{cod}:
    get:
      operationId: getCodCaen
      tags: [coduri-caen]
      summary: Obține un cod CAEN specific
      parameters:
        - name: cod
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cod CAEN găsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodCaen"
        "404":
          description: Cod negăsit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  # ── Plăți ──────────────────────────────────────────────────────────────────
  /plati:
    get:
      operationId: listPlati
      tags: [plati]
      summary: Listează plățile utilizatorului
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [in_asteptare, platit, esuat, rambursat]
        - name: dosarId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista plăților
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plata"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    post:
      operationId: createPlata
      tags: [plati]
      summary: Înregistrează o plată nouă
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlataBody"
      responses:
        "201":
          description: Plată înregistrată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plata"
        "400":
          description: Date invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"
        "401":
          description: Neautentificat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

  /plati/{id}:
    get:
      operationId: getPlata
      tags: [plati]
      summary: Obține detaliile unei plăți
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Plată găsită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plata"
        "404":
          description: Plată negăsită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

    patch:
      operationId: updatePlata
      tags: [plati]
      summary: Actualizează statusul unei plăți
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlataBody"
      responses:
        "200":
          description: Plată actualizată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plata"
        "404":
          description: Plată negăsită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRaspuns"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorRaspuns:
      type: object
      properties:
        eroare:
          type: string
      required: [eroare]

    # ── Auth ──────────────────────────────────────────────────────────────────
    Utilizator:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        nume:
          type: string
        prenume:
          type: string
        telefon:
          type: ["string", "null"]
        rol:
          type: string
          enum: [client, admin]
        creatLa:
          type: string
          format: date-time
        actualizatLa:
          type: string
          format: date-time
      required: [id, email, nume, prenume, rol, creatLa, actualizatLa]

    AuthRaspuns:
      type: object
      properties:
        token:
          type: string
        utilizator:
          $ref: "#/components/schemas/Utilizator"
      required: [token, utilizator]

    InregistrareBody:
      type: object
      properties:
        email:
          type: string
          format: email
        parola:
          type: string
          minLength: 8
        nume:
          type: string
        prenume:
          type: string
        telefon:
          type: ["string", "null"]
      required: [email, parola, nume, prenume]

    AutentificareBody:
      type: object
      properties:
        email:
          type: string
          format: email
        parola:
          type: string
      required: [email, parola]

    UpdateProfilBody:
      type: object
      properties:
        nume:
          type: string
        prenume:
          type: string
        telefon:
          type: ["string", "null"]

    # ── Dosare ────────────────────────────────────────────────────────────────
    Dosar:
      type: object
      properties:
        id:
          type: integer
        utilizatorId:
          type: integer
        denumireFirma:
          type: string
          description: Denumirea firmei
        formaJuridica:
          type: string
          enum: [SRL, SA, SNC, SCS, RA, SRL_D]
        judet:
          type: ["string", "null"]
        localitate:
          type: ["string", "null"]
        adresaSediu:
          type: ["string", "null"]
        codPostal:
          type: ["string", "null"]
        codCaenPrincipal:
          type: ["string", "null"]
          description: Codul CAEN al activității principale
        descriereActivitate:
          type: ["string", "null"]
        capitalSocial:
          type: ["number", "null"]
        numarParti:
          type: ["integer", "null"]
          description: Număr de părți sociale
        valoareParte:
          type: ["number", "null"]
          description: Valoarea unei părți sociale
        pasCurent:
          type: integer
          description: "Pasul curent al wizard-ului (1-6)"
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [ciorna, in_asteptare, in_procesare, aprobat, respins]
        numarInregistrare:
          type: ["string", "null"]
          description: Numărul oficial de înregistrare (după aprobare)
        cui:
          type: ["string", "null"]
          description: Codul Unic de Înregistrare
        noteMentor:
          type: ["string", "null"]
        creatLa:
          type: string
          format: date-time
        actualizatLa:
          type: string
          format: date-time
      required:
        - id
        - utilizatorId
        - denumireFirma
        - formaJuridica
        - pasCurent
        - status
        - creatLa
        - actualizatLa

    DosarDetaliat:
      allOf:
        - $ref: "#/components/schemas/Dosar"
        - type: object
          properties:
            asociati:
              type: array
              items:
                $ref: "#/components/schemas/Asociat"
            plati:
              type: array
              items:
                $ref: "#/components/schemas/Plata"
          required: [asociati, plati]

    DosarStatistici:
      type: object
      properties:
        total:
          type: integer
        peStatus:
          type: object
          properties:
            ciorna:
              type: integer
            in_asteptare:
              type: integer
            in_procesare:
              type: integer
            aprobat:
              type: integer
            respins:
              type: integer
          required: [ciorna, in_asteptare, in_procesare, aprobat, respins]
        totalPlatiEfectuate:
          type: number
        dosareRecente:
          type: array
          items:
            $ref: "#/components/schemas/Dosar"
      required: [total, peStatus, totalPlatiEfectuate, dosareRecente]

    CreateDosarBody:
      type: object
      properties:
        denumireFirma:
          type: string
        formaJuridica:
          type: string
          enum: [SRL, SA, SNC, SCS, RA, SRL_D]
        judet:
          type: ["string", "null"]
        localitate:
          type: ["string", "null"]
        adresaSediu:
          type: ["string", "null"]
        codPostal:
          type: ["string", "null"]
        codCaenPrincipal:
          type: ["string", "null"]
        descriereActivitate:
          type: ["string", "null"]
        capitalSocial:
          type: ["number", "null"]
        numarParti:
          type: ["integer", "null"]
        valoareParte:
          type: ["number", "null"]
      required: [denumireFirma, formaJuridica]

    UpdateDosarBody:
      type: object
      properties:
        denumireFirma:
          type: string
        formaJuridica:
          type: string
          enum: [SRL, SA, SNC, SCS, RA, SRL_D]
        judet:
          type: ["string", "null"]
        localitate:
          type: ["string", "null"]
        adresaSediu:
          type: ["string", "null"]
        codPostal:
          type: ["string", "null"]
        codCaenPrincipal:
          type: ["string", "null"]
        descriereActivitate:
          type: ["string", "null"]
        capitalSocial:
          type: ["number", "null"]
        numarParti:
          type: ["integer", "null"]
        valoareParte:
          type: ["number", "null"]
        noteMentor:
          type: ["string", "null"]
        cui:
          type: ["string", "null"]
        numarInregistrare:
          type: ["string", "null"]
        status:
          type: string
          enum: [ciorna, in_asteptare, in_procesare, aprobat, respins]

    UpdatePasBody:
      type: object
      properties:
        pas:
          type: integer
          minimum: 1
          maximum: 6
      required: [pas]

    # ── Asociat ───────────────────────────────────────────────────────────────
    Asociat:
      type: object
      properties:
        id:
          type: integer
        dosarId:
          type: integer
        numeComplet:
          type: string
        cnp:
          type: ["string", "null"]
          description: Cod Numeric Personal
        tipActIdentitate:
          type: string
          enum: [ci, pasaport, alta]
        serieNumarActIdentitate:
          type: ["string", "null"]
        nationalitate:
          type: string
        adresa:
          type: ["string", "null"]
        numarParti:
          type: integer
          description: Număr de părți sociale deținute
        procentDetinere:
          type: number
          description: Procentul din capitalul social (%)
        aportCapital:
          type: number
          description: Aportul la capitalul social (RON)
        estePersoanaJuridica:
          type: boolean
          description: "True dacă asociatul este persoană juridică"
        cuiPersoanaJuridica:
          type: ["string", "null"]
          description: CUI dacă asociatul este persoană juridică
        creatLa:
          type: string
          format: date-time
        actualizatLa:
          type: string
          format: date-time
      required:
        - id
        - dosarId
        - numeComplet
        - tipActIdentitate
        - nationalitate
        - numarParti
        - procentDetinere
        - aportCapital
